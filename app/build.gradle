apply plugin: 'com.android.application'

android {
    compileSdk 35
    namespace 'ee.vvk.ivotingverification'
    buildToolsVersion = '35.0.0'

    defaultConfig {
        minSdkVersion 33
        targetSdkVersion 35
        versionCode 41
        versionName "3.1.27"

        signingConfig signingConfigs.debug
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    testFixtures {
        enable = true
    }

   compileOptions {
     sourceCompatibility JavaVersion.VERSION_17
     targetCompatibility JavaVersion.VERSION_17
   }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions = ["default"]

    productFlavors {

        production {
            applicationId "ee.ivxv.ivotingverification"
            dimension "default"
            buildConfigField("String", "CONFIG_FILE",
                    "\"https://www.valimised.ee/verify/config.json\"")
        }

        configTest {
            applicationId "ee.ivxv.ivotingverification.test"
            dimension "default"
            versionNameSuffix '~test'
            buildConfigField("String", "CONFIG_FILE",
                    "\"https://verifier.ivxv.ee/test/config.json\"")
        }

        configDemo {
            applicationId "ee.ivxv.ivotingverification.demo"
            dimension "default"
            versionNameSuffix "~demo"
            buildConfigField("String", "CONFIG_FILE",
                    "\"https://verifier.ivxv.ee/demo/config.json\"")
        }
    }

    lint {
        warning 'InvalidPackage'
    }
}

dependencies {
    implementation files('libs/xom-1.2.10.jar')
    implementation 'androidx.core:core:1.15.0'
    implementation group: 'com.madgag.spongycastle', name: 'core', version: '1.58.0.0'
    implementation group: 'com.madgag.spongycastle', name: 'prov', version: '1.58.0.0'
    implementation group: 'com.madgag.spongycastle', name: 'pkix', version: '1.54.0.0'

    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'

    implementation 'androidx.camera:camera-core:1.4.0'
    implementation "androidx.camera:camera-lifecycle:1.4.0"
    implementation "androidx.camera:camera-view:1.4.0"
    implementation "androidx.camera:camera-camera2:1.4.0"
    implementation "androidx.camera:camera-extensions:1.4.0"
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // for local unittests
    testFixturesImplementation 'com.madgag.spongycastle:core:1.58.0.0'
    testFixturesImplementation 'com.madgag.spongycastle:prov:1.58.0.0'
    testFixturesImplementation 'com.madgag.spongycastle:pkix:1.54.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
